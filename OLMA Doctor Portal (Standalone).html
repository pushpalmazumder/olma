  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

tr.detail }}<\u002Fdiv><\u002Fdiv>\n                  <div style=\"font-size:11.5px;color:var(--t3);\">{{ tr.date }}<\u002Fdiv>\n                  <span style=\"font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:{{ tr.stBg }};color:{{ tr.stColor }};\">{{ tr.status }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fdiv>\n\n        <!-- Clinical notes -->\n        <section style=\"background:var(--sf);border:1px solid var(--bd2);border-radius:20px;padding:24px;box-shadow:var(--sh1);\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;\">\n            <div style=\"font-size:14px;font-weight:700;\">Clinical Notes<\u002Fdiv>\n            <button onclick=\"{{ qaAddNote }}\" style=\"border:none;background:transparent;color:var(--gold);font-size:12.5px;font-weight:600;cursor:pointer;\">＋ Add note<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;\">\n            <div style=\"display:flex;flex-direction:column;gap:12px;\">\n              <sc-for list=\"{{ notes }}\" as=\"nt\" hint-placeholder-count=\"2\">\n                <div style=\"background:var(--sf2);border:1px solid var(--bd2);border-radius:14px;padding:14px 16px;\">\n                  <div style=\"display:flex;justify-content:space-between;margin-bottom:6px;\"><span style=\"font-size:11px;font-weight:700;color:var(--gold);\">{{ nt.date }}<\u002Fspan><span style=\"font-size:11px;color:var(--t3);\">{{ nt.author }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:var(--t2);line-height:1.6;\">{{ nt.text }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:10px;\">\n              <textarea placeholder=\"Write a new clinical note…\" aria-label=\"New clinical note\" style=\"flex:1;min-height:120px;resize:none;padding:14px 16px;border-radius:14px;border:1px solid var(--bd);background:var(--sf2);color:var(--t1);font-size:13px;line-height:1.6;\"><\u002Ftextarea>\n              <div style=\"display:flex;justify-content:flex-end;gap:8px;\">\n                <button onclick=\"{{ noteDraft }}\" style=\"padding:9px 16px;border:1px solid var(--bd);border-radius:12px;background:transparent;color:var(--t2);font-size:12px;font-weight:600;cursor:pointer;\">Save Draft<\u002Fbutton>\n                <button onclick=\"{{ noteSign }}\" style=\"padding:9px 16px;border:none;border-radius:12px;background:linear-gradient(135deg, var(--gold), var(--goldHi));color:#141209;font-size:12px;font-weight:700;cursor:pointer;\">Sign &amp; Save<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ SETTINGS ============ -->\n      <sc-if value=\"{{ pgSettings }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Settings\" style=\"padding:32px;max-width:760px;margin:0 auto;animation:fadeUp .35s ease both;\">\n        <div style=\"font-size:26px;font-weight:700;letter-spacing:-.02em;margin-bottom:24px;\">Settings<\u002Fdiv>\n        <section style=\"background:var(--sf);border:1px solid var(--bd2);border-radius:20px;box-shadow:var(--sh1);overflow:hidden;margin-bottom:16px;\">\n          <div style=\"padding:16px 24px;border-bottom:1px solid var(--bd2);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);\">Appearance<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;justify-content:space-between;padding:16px 24px;\">\n            <div><div style=\"font-size:13.5px;font-weight:600;\">Dark Mode<\u002Fdiv><div style=\"font-size:12px;color:var(--t2);\">Full dark theme across the portal<\u002Fdiv><\u002Fdiv>\n            <button onclick=\"{{ toggleThem id),\n      color: s.page === id ? 'var(--gold)' : 'var(--t2)',\n      bg: s.page === id ? 'color-mix(in oklab, var(--gold) 12%, transparent)' : 'transparent',\n      weight: s.page === id ? 700 : 500\n    }));\n\n    // ---- Dashboard data ----\n    const soft = (c, p) => `color-mix(in oklab, ${c} ${p}%, transparent)`;\n    const todayAppts = [\n      { time: '2:30 PM', init: 'SR', name: 'Sofia Rossi', kind: 'Quarterly longevity review · Video', tag: 'Pro', tagBg: soft('var(--gold)', 15), tagColor: 'var(--gold)', cta: 'Prepare', go: () => this.go('patient') },\n      { time: '4:00 PM', init: 'MB', name: 'Marco Bianchi', kind: 'Post-treatment follow-up · Video', tag: 'Senior', tagBg: soft('var(--blu)', 14), tagColor: 'var(--blu)', cta: 'View', go: () => this.go('schedule') },\n      { time: '5:30 PM', init: 'EF', name: 'Elena Ferri', kind: 'Initial consultation · In clinic', tag: 'Vitality', tagBg: soft('var(--grn)', 14), tagColor: 'var(--grn)', cta: 'View', go: () => this.go('schedule') }\n    ];\n    const criticals = [\n      { name: 'Marco Bianchi', marker: 'hs-CRP · inflammation', value: '4.8 mg/L', flag: 'HIGH', valColor: 'var(--red)', flagBg: soft('var(--red)', 12), go: () => this.go('patient') },\n      { name: 'Elena Ferri', marker: 'HbA1c · glycemic', value: '6.1 %', flag: 'ELEVATED', valColor: 'var(--red)', flagBg: soft('var(--red)', 12), go: () => this.go('patient') },\n      { name: 'Luca Terzi', marker: 'Vitamin D', value: '18 ng/mL', flag: 'LOW', valColor: 'var(--blu)', flagBg: soft('var(--blu)', 12), go: () => this.go('patient') },\n      { name: 'Sofia Rossi', marker: 'ApoB · lipids', value: '92 mg/dL', flag: 'WATCH', valColor: 'var(--gold)', flagBg: soft('var(--gold)', 14), go: () => this.go('patient') }\n    ];\n    const aiSugs = [\n      { text: 'Sofia Rossi\\u2019s ApoB has risen 8% over two quarters — consider revisiting lipid protocol before today\\u2019s review.', review: () => this.openAiMode('proposal'), dismiss: () => this.flash('Suggestion dismissed') },\n      { text: 'Marco Bianchi\\u2019s hs-CRP pattern resembles his pre-treatment baseline. A comparison of last two visits is available.', review: () => this.openAiMode('compare'), dismiss: () => this.flash('Suggestion dismissed') },\n      { text: '3 patients are due for semi-annual biological age reassessment this month.', review: () => this.go('patients'), dismiss: () => this.flash('Suggestion dismissed') }\n    ];\n    const taskDefs = [\n      ['t1', 'Sign consultation report — Luca Terzi', 'Due today', 'var(--red)'],\n      ['t2', 'Review June lab panel — Sofia Rossi', 'Before 2:30 PM', 'var(--red)'],\n      ['t3', 'Approve updated treatment plan — Anna Moretti', 'Done', 'var(--t3)'],\n      ['t4', 'Confirm availability for week 29', 'Fri', 'var(--t3)']\n    ];\n    const doneCount = taskDefs.filter(([id]) => s.done[id]).length;\n    const tasks = taskDefs.map(([id, label, due, dueColor]) => {\n      const d = s.done[id];\n      return {\n        label, due: d ? 'Done' : due,\n        dueColor: d ? 'var(--grn)' : dueColor,\n        check: d ? '✓' : '',\n        boxBg: d ? 'var(--gold)' : 'transparent',\n        boxBorder: d ? 'var(--gold)' : 'var(--t3)',\n        textColor: d ? 'var(--t3)' : 'var(--t1)',\n        deco: d ? 'line-through' : 'none',\n        toggle: () => this.setState(st => ({ done: { ...st.done, [id]: !st.done[id] } }))\n      };\n    });\n    const revData = [['Feb', 16.2], ['Mar', 18.9], ['Apr', 17.4], ['May', 20.8], ['Jun', 22.0], ['Jul', 24.6]];\n    const revMax = 24.6;\n    const revBars = revData.map(([m, v], i) => ({\n      m, val: '€' + v + 'k',\n      h: Math.round((v / revMax) * 72) + 'px',\n      fill: i === revData.length - 1 ? 'linear-gradient(180deg, var(--goldHi), var(--gold))' : soft('var(--gold)', 25)\n    }));\n\n    // ---- Schedule ----\n    const weekDays = [['Mon', '6', '2 appts'], ['Tue', '7', '3 appts'], ['Wed', '8', '—'], ['Thu', '9', '4 appts'], ['Fri', '10', '3 appts'], ['Sat', '11', '2 appts'], [' t: s.page === 'patient',\n      pgSettings: s.page === 'settings',\n      pageTitle: titles[s.page] || 'OLMA',\n      navItems, todayAppts, criticals, aiSugs, tasks, revBars,\n      weekDays, schedRows, patientRows, timeline, treatments, notes, settingRows,\n      tasksDone: doneCount + ' of ' + taskDefs.length + ' done',\n      labChips, labLast: lab.last, labRef: lab.ref, labStatus: lab.status,\n      labPoints: lab.points, labLastY: lab.lastY,\n      labStBg: lab.ok ? soft('var(--grn)', 13) : soft('var(--gold)', 15),\n      labStColor: lab.ok ? 'var(--grn)' : 'var(--gold)',\n      aiOpen: s.aiOpen,\n      aiChips, aiHeading: mode.heading,\n      aiLines: mode.lines.map(([mark, dot, text]) => ({ mark, dot, text })),\n      themeIcon: s.theme === 'light' ? '◐' : '◑',\n      darkOn: s.theme === 'dark' ? 'true' : 'false',\n      swBg: s.theme === 'dark' ? 'var(--gold)' : 'var(--bd)',\n      swLeft: s.theme === 'dark' ? '23px' : '3px',\n      toastOn: !!s.toast, toastMsg: s.toast,\n      doLogin: () => this.setState({ page: 'dashboard' }),\n      doLogout: () => this.setState({ page: 'login', aiOpen: false }),\n      toggleTheme: () => this.setState(st => ({ theme: st.theme === 'light' ? 'dark' : 'light' })),\n      goSchedule: () => this.go('schedule'),\n      goPatient: () => this.go('patient'),\n      openAi: () => this.setState({ aiOpen: true }),\n      closeAi: () => this.setState({ aiOpen: false }),\n      aiSummary: () => this.openAiMode('summary'),\n      aiBiomarkers: () => this.openAiMode('biomarkers'),\n      aiInsert: () => { this.setState({ aiOpen: false, page: 'patient' }); this.flash('Draft inserted into clinical notes'); },\n      aiRegen: () => this.flash('Regenerating…'),\n      aiSend: () => this.flash('AI response streaming — prototype'),\n      qaNewVisit: () => this.flash('New Visit — opens visit workflow'),\n      qaAddNote: () => { this.go('patient'); this.flash('Jump to clinical notes'); },\n      qaUpload: () => this.flash('Upload File — open
